; detTest - capture & inference stability test configuration
; Encoding: UTF-8. This file lives next to detTest.vcxproj and is copied
; next to the .exe by the post-build step.
;
; Accepted boolean values: 1/0, true/false, yes/no, on/off.
; Section and key names are case-insensitive. Missing keys fall back to the
; defaults documented below. ';' and '#' start a whole-line comment.

[Target]
; Which window to capture from. The game is located by PROCESS NAME first --
; window titles are unstable (launchers, anti-cheat shells and UE helper
; windows all carry similar captions, and some titles are localised).
;
; Every value is a case-insensitive SUBSTRING match, and only the non-empty
; ones are enforced, so `process` alone means "any visible window belonging to
; that executable". A trailing ".exe" is optional on both sides: `FarCry6`,
; `FarCry6.exe` and `farcry6` all match FarCry6.exe.
process = NGR-Win64-Shipping

; Optional narrowing filters. Leave them empty unless a game owns more than one
; visible window and the wrong one gets picked.
; title = 王者荣耀世界
; class = UnrealWindow

; Ready-made profiles for the three games under test. Replace the `process`
; line with the one for the game you are exercising:
;
;   王者荣耀世界 (Honour of Kings: World)
;     process = NGR-Win64-Shipping
;
;   绝区零 (Zenless Zone Zero)
;     process = ZenlessZoneZero
;
;   孤岛惊魂6 (Far Cry 6)
;     process = FarCry6
;
; Not sure of the executable name? Start the game, then run:
;     tasklist /fi "STATUS eq running" /fo csv | findstr /i "\.exe"
; or check Details in Task Manager. The name is matched as a substring, so a
; distinctive fragment is enough.

[Log]
; Mirrors to stdout. detTest prints the periodic stability report here, so it
; is on by default -- unlike the parent project where it was off.
console = true

; Write DEBUG_LOG* text files under \Log\. Off keeps the disk quiet.
text = false

; Show the OpenCV window. The window is created with HWND_NOTOPMOST +
; SWP_NOACTIVATE so it cannot steal focus from the game.
show = true

[Metrics]
; Master switch for the stability instrumentation. When off, no per-frame
; accounting, no report and no CSV are produced.
enable = true

; Draw the live overlay (FPS / method / state / drop counters) on the frame.
; Ignored when [Log] show = false, since there is nothing to draw onto.
hud = true

; Period of the console stability report, in seconds.
report_interval_sec = 5

; Write one CSV row per captured frame for offline analysis. Written into
; csv_dir as detTest_metrics_<timestamp>.csv, next to the .exe.
csv = false
csv_dir = metrics
